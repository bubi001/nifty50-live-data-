name: Yahoo Finance Nifty 50 Scraper

on:
  schedule:
    # Triggers every 30 minutes from Monday to Friday during NSE trading hours
    - cron: '*/30 3-10 * * 1-5'
  workflow_dispatch: # Keeps manual testing button enabled

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest
    # Gives the action permission to write the updated CSV data back to your repo
    permissions:
      contents: write

    steps:
    - name: Checkout Repo Code
      uses: actions/checkout@v4

    - name: Initialize Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install & Force Upgrade Packages
      run: |
        python -m pip install --upgrade pip
        # Forcing upgrade on yfinance fixes sudden empty header bugs caused by API changes
        pip install --upgrade yfinance pandas

    - name: Execute Scraping Engine
      run: python scraper.py

    - name: Save Data Rows Back to GitHub Repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add nifty50_live.csv
        git commit -m "Automated Sync: Live Nifty 50 dataset updated" || echo "No data modifications detected"
        git push
